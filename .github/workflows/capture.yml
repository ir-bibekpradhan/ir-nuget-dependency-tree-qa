name: Capture candidate contracts for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scenarios.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: scenarios
        run: |
          QA_MATRIX="$(python3 tools/discover.py --mode capture)"
          echo "matrix=$QA_MATRIX" >> "$GITHUB_OUTPUT"
  capture:
    needs: discover
    runs-on: ${{ matrix.scenario.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.scenario.sdk }}
      - run: python tools/capture_contracts.py "${{ matrix.scenario.path }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-${{ matrix.scenario.id }}
          path: drafts/
