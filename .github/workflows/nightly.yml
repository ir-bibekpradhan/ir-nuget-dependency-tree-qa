name: NuGet dependency graph nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      use_pse:
        description: Submit nightly cases to InvisiRisk PSE
        type: boolean
        default: true

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scenarios.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: scenarios
        shell: bash
        run: |
          QA_MATRIX="$(python3 tools/discover.py --mode nightly)"
          echo "matrix=$QA_MATRIX" >> "$GITHUB_OUTPUT"

  scenario:
    needs: discover
    name: ${{ matrix.scenario.id }} - ${{ matrix.scenario.name }}
    runs-on: ${{ matrix.scenario.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      IR_TOKEN: ${{ secrets.IR_TOKEN }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages-${{ matrix.scenario.id }}
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-${{ matrix.scenario.id }}

    steps:
      - uses: actions/checkout@v5
      - name: Register post-collection replay trace
        uses: ./.github/actions/collector-trace
        env:
          QA_SCENARIO_PATH: ${{ matrix.scenario.path }}
      - name: Set up InvisiRisk PSE
        if: env.IR_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.use_pse
        uses: invisirisk/pse-action@latest
        with:
          api_url: https://app.stage.invisirisk.com
          app_token: ${{ secrets.IR_TOKEN }}
          collect_dependencies: true
          workdir: ${{ matrix.scenario.path }}
          job_identifier: nuget-nightly-${{ matrix.scenario.id }}
          job_label: Nightly ${{ matrix.scenario.id }} - ${{ matrix.scenario.name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.scenario.sdk }}
      - run: python tools/run_scenario.py "${{ matrix.scenario.path }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.scenario.id }}
          path: |
            out/${{ matrix.scenario.id }}/
            ${{ matrix.scenario.path }}/packages.lock.json
            ${{ matrix.scenario.path }}/**/project.assets.json
