name: NuGet dependency graph QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scenarios.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: scenarios
        name: Discover deterministic scenarios
        shell: bash
        run: echo "matrix=$(python3 tools/discover.py --mode deterministic)" >> "$GITHUB_OUTPUT"

  scenario:
    needs: discover
    name: ${{ matrix.scenario.id }} - ${{ matrix.scenario.name }}
    runs-on: ${{ matrix.scenario.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      IR_TOKEN: ${{ secrets.IR_TOKEN }}
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages-${{ matrix.scenario.id }}
      NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}/.nuget/http-${{ matrix.scenario.id }}

    steps:
      - name: Set up InvisiRisk PSE
        if: env.IR_TOKEN != ''
        uses: invisirisk/pse-action@latest
        with:
          api_url: https://app.stage.invisirisk.com
          app_token: ${{ secrets.IR_TOKEN }}
          collect_dependencies: true
          workdir: ${{ matrix.scenario.path }}
          job_identifier: nuget-${{ matrix.scenario.id }}
          job_label: ${{ matrix.scenario.id }} - ${{ matrix.scenario.name }}

      - uses: actions/checkout@v5

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.419

      - name: Validate scenario contract
        run: |
          python tools/validate_scenarios.py
          python -m unittest discover -s tools -p "test_*.py"

      - name: Restore and verify scenario
        run: python tools/run_scenario.py "${{ matrix.scenario.path }}"

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.scenario.id }}
          if-no-files-found: warn
          path: |
            out/${{ matrix.scenario.id }}/
            ${{ matrix.scenario.path }}/scenario.json
            ${{ matrix.scenario.path }}/expected/graph.json
            ${{ matrix.scenario.path }}/packages.lock.json
            ${{ matrix.scenario.path }}/**/packages.lock.json
            ${{ matrix.scenario.path }}/**/project.assets.json

  report:
    needs: scenario
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: Publish scenario summaries
        shell: bash
        run: |
          find results -name summary.md -print -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
